<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://karaokewonders.fetched.workers.dev https://cloudflareinsights.com https://www.google-analytics.com https://*.google-analytics.com; img-src 'self' data: https:; object-src 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Karaoke Wonders</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="files/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/image/kwicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <meta property="og:title" content="Karaoke Wonders - Karaoke" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karaokewonders.com/main" />
    <meta property="og:description" content="A website to view and request songs for our VRChat world's karaoke system!" />
    <meta property="og:site_name" content="Karaoke Wonders" />
    <meta property="og:image" content="https://karaokewonders.com/image/kw.png" />
    <meta name="theme-color" content="#90ee90" />
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 768px)">
    <script src="schema.js" defer></script>

<style>
  :root {
    --kw-bg: #0f172a;
    --kw-panel: #1e293b;
    --kw-accent: #90ee90;
    --kw-accent-hover: #76d776;
    --kw-accent-text: #052e16;
    --kw-text: #f8fafc;
    --kw-text-muted: #94a3b8;
    --kw-border: #334155;
    --kw-user-msg: #1e1b4b;
    --kw-user-border: #312e81;
  }

  /* Fullscreen Chat Container */
  .kw-chat-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* Adapts properly on mobile browser viewports */
    background-color: var(--kw-panel);
    border: none;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    box-shadow: none;
    font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    z-index: 9999;
    overflow: hidden;
  }

  /* Header Bar */
  .kw-chat-header {
    background-color: var(--kw-bg);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--kw-border);
    user-select: none;
  }

  .kw-chat-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    color: var(--kw-text);
    font-size: 1.1rem;
  }

  .kw-status-dot {
    width: 10px;
    height: 10px;
    background-color: var(--kw-accent);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px var(--kw-accent);
  }

  #kw-chat-toggle {
    display: none; /* Hidden for full-screen layout */
  }

  /* Messages Area */
  .kw-chat-messages {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
    scroll-behavior: smooth;
  }

  /* Custom Dark Scrollbar for Messages Area */
  .kw-chat-messages::-webkit-scrollbar {
    width: 6px;
  }

  .kw-chat-messages::-webkit-scrollbar-track {
    background: transparent;
  }

  .kw-chat-messages::-webkit-scrollbar-thumb {
    background-color: var(--kw-border);
    border-radius: 3px;
  }

  /* Base Message Bubbles */
  .kw-message {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    line-height: 1.6;
    word-break: break-word;
  }

  .kw-message-user {
    background-color: var(--kw-user-msg);
    color: #ffffff;
    align-self: flex-end;
    border: 1px solid var(--kw-user-border);
    border-bottom-right-radius: 4px;
  }

  .kw-message-ai {
    background-color: var(--kw-bg);
    color: var(--kw-text);
    align-self: flex-start;
    border: 1px solid var(--kw-border);
    border-bottom-left-radius: 4px;
  }

  .kw-message-loading {
    opacity: 0.7;
    font-style: italic;
  }

  /* ==========================================================================
     MARKDOWN RENDERING STYLES (inside AI messages)
     ========================================================================== */

  .kw-message-ai p {
    margin: 0 0 12px 0;
  }

  .kw-message-ai p:last-child {
    margin-bottom: 0;
  }

  .kw-message-ai ul,
  .kw-message-ai ol {
    margin: 8px 0 12px 20px;
    padding: 0;
  }

  .kw-message-ai ul {
    list-style-type: disc;
  }

  .kw-message-ai ol {
    list-style-type: decimal;
  }

  .kw-message-ai li {
    margin-bottom: 6px;
  }

  .kw-message-ai li:last-child {
    margin-bottom: 0;
  }

  /* Clickable Links */
  .kw-message-ai a {
    color: var(--kw-accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-weight: 500;
    transition: color 0.2s;
  }

  .kw-message-ai a:hover {
    color: var(--kw-accent-hover);
  }

  /* Bold & Emphasis */
  .kw-message-ai strong {
    color: #ffffff;
    font-weight: 700;
  }

  .kw-message-ai em {
    color: var(--kw-text-muted);
  }

  /* Inline Code & Code Blocks */
  .kw-message-ai code {
    background-color: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.88em;
  }

  .kw-message-ai pre {
    background-color: #090d16;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid var(--kw-border);
    margin: 10px 0;
  }

  .kw-message-ai pre code {
    background-color: transparent;
    padding: 0;
  }

  /* Blockquotes */
  .kw-message-ai blockquote {
    border-left: 3px solid var(--kw-accent);
    margin: 10px 0;
    padding-left: 12px;
    color: var(--kw-text-muted);
  }

  /* ==========================================================================
     INPUT AREA (Full-width background with centered container)
     ========================================================================== */

  .kw-chat-footer {
    background-color: var(--kw-bg);
    border-top: 1px solid var(--kw-border);
    width: 100%;
  }

  .kw-chat-input-area {
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  #kw-chat-input {
    flex: 1;
    background-color: var(--kw-panel);
    border: 1px solid var(--kw-border);
    color: var(--kw-text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #kw-chat-input:focus {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 2px rgba(144, 238, 144, 0.15);
  }

  #kw-chat-input::placeholder {
    color: var(--kw-text-muted);
  }

  #kw-chat-send {
    background-color: var(--kw-accent);
    color: var(--kw-accent-text);
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background-color 0.2s, opacity 0.2s;
  }

  #kw-chat-send:hover:not(:disabled) {
    background-color: var(--kw-accent-hover);
  }

  #kw-chat-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body class="mobile-centered-page p-6 relative flex items-center justify-center min-h-screen bg-slate-950 text-slate-100">

    <div id="kw-chat-widget" class="kw-chat-container">
      <div class="kw-chat-header">
        <div class="kw-chat-title">
          <span class="kw-status-dot"></span>
          <span>Karaoke Wonders Assistant</span>
        </div>
        <button type="button" id="kw-chat-toggle" aria-label="Toggle chat">−</button>
      </div>
      
      <div id="kw-chat-messages" class="kw-chat-messages">
        <div class="kw-message kw-message-ai">
          Welcome to Karaoke Wonders! Ask me anything about our VRChat world, events, community roles, or song requests.
        </div>
      </div>

      <form id="kw-chat-form" class="kw-chat-input-area">
        <input 
          type="text" 
          id="kw-chat-input" 
          placeholder="Type a question..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="kw-chat-send">Send</button>
      </form>
    </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const chatContainer = document.getElementById('kw-chat-widget');
    const chatMessages = document.getElementById('kw-chat-messages');
    const chatForm = document.getElementById('kw-chat-form');
    const chatInput = document.getElementById('kw-chat-input');
    const chatSendBtn = document.getElementById('kw-chat-send');
    const chatToggleBtn = document.getElementById('kw-chat-toggle');

    // Toggle Minimize / Expand Widget (if toggle button exists)
    if (chatToggleBtn) {
      chatToggleBtn.addEventListener('click', () => {
        chatContainer.classList.toggle('minimized');
        chatToggleBtn.textContent = chatContainer.classList.contains('minimized') ? '+' : '−';
      });
    }

    // Handle Chat Submission
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = chatInput.value.trim();
      if (!prompt) return;

      // 1. Render User Message (Plain text to prevent XSS)
      appendMessage(prompt, 'user');
      chatInput.value = '';
      chatInput.disabled = true;
      chatSendBtn.disabled = true;

      // 2. Render Loading State
      const loadingMessage = appendMessage('Thinking...', 'ai', true);

      try {
        // 3. Send request to Cloudflare Pages Function endpoint
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        if (!response.ok) {
          throw new Error('Server returned an error response');
        }

        const data = await response.json();
        
        // Handle Workers AI response payload formats
        const aiText = data.response || data.result?.response || 'Sorry, I could not process that request.';
        
        // 4. Parse Markdown into HTML for AI Response
        if (window.marked) {
          loadingMessage.innerHTML = marked.parse(aiText);
        } else {
          loadingMessage.textContent = aiText;
        }
        loadingMessage.classList.remove('kw-message-loading');

      } catch (error) {
        console.error('Chat API Error:', error);
        loadingMessage.textContent = 'Sorry, something went wrong. Please try again.';
        loadingMessage.classList.remove('kw-message-loading');
      } finally {
        chatInput.disabled = false;
        chatSendBtn.disabled = false;
        chatInput.focus();
        scrollToBottom();
      }
    });

    function appendMessage(text, sender, isLoading = false) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('kw-message', `kw-message-${sender}`);
      if (isLoading) {
        msgDiv.classList.add('kw-message-loading');
      }

      // User messages and loading states stay textContent; AI answers get parsed as Markdown
      if (sender === 'user' || isLoading) {
        msgDiv.textContent = text;
      } else if (window.marked) {
        msgDiv.innerHTML = marked.parse(text);
      } else {
        msgDiv.textContent = text;
      }

      chatMessages.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  });
</script>
</body>
</html>
