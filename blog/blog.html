<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Forum - Karaoke Wonders</title>

    <!-- CSP Updated with search plugin requirements -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://karaokewonders.fetched.workers.dev; img-src 'self' data: https:; object-src 'none';">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/files/lucide.min.js"></script>

    <!-- Docsify Dark Theme CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/docsify/4.13.1/themes/dark.min.css">

    <!-- Absolute Paths -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/image/kwicon.svg" />
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <meta name="theme-color" content="#0f172a" />

    <!-- Forum & Modern Dark UI Customization -->
    <style>
        :root {
            --base-background-color: #0b0f19;
            --sidebar-background: #111827;
            --theme-color: #38bdf8;
            --text-color-base: #cbd5e1;
            --sidebar-width: 280px;
        }

        body {
            background-color: #0b0f19 !important;
            color: #cbd5e1 !important;
            font-family: 'Inter', sans-serif !important;
        }

        /* --- Discourse / Roblox Forum Header Bar --- */
        .forum-top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #111827;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 99;
        }

        .forum-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #f8fafc;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
        }

        .forum-brand img {
            width: 28px;
            height: 28px;
        }

        .forum-nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .forum-nav-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forum-nav-links a:hover, .forum-nav-links a.active {
            color: #38bdf8;
        }

        /* Adjust body wrapper to clear fixed header */
        #app {
            padding-top: 60px;
        }

        /* --- Forum Sidebar Styling (Discourse Style) --- */
        .sidebar {
            background-color: #111827 !important;
            border-right: 1px solid #1e293b !important;
            color: #94a3b8 !important;
            top: 60px !important;
            padding-top: 1.5rem !important;
            z-Index: 10 !important;
        }

        /* Fix hamburger toggle blocking clicks on desktop/tablet */
        .sidebar-toggle {
            display: none !important;
        }

        .sidebar h1 a {
            color: #f8fafc !important;
            font-weight: 700;
            font-size: 1.1rem !important;
            letter-spacing: -0.025em;
            padding: 0 1rem;
        }

        /* Simulate Forum Categories in Sidebar */
        .sidebar ul {
            padding: 0 0.75rem !important;
        }

        .sidebar ul li {
            margin: 0.25rem 0;
        }

        .sidebar ul li a {
            color: #94a3b8 !important;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem !important;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar ul li a:hover, .sidebar ul li.active > a {
            color: #38bdf8 !important;
            background-color: rgba(56, 189, 248, 0.1) !important;
            font-weight: 600;
        }

        /* Search Box Styling inside Sidebar */
        .search {
            padding: 0 1rem 1rem 1rem !important;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 1rem;
        }

        .search input {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #f8fafc !important;
            border-radius: 0.5rem !important;
            padding: 0.5rem 0.75rem !important;
            font-size: 0.875rem !important;
        }

        .search input::placeholder {
            color: #64748b !important;
        }

        .search .clear-button {
            color: #64748b !important;
        }

        .search-results {
            background-color: #111827 !important;
            border: 1px solid #1e293b !important;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* --- Main Forum Topic / Content Container --- */
        .content {
            background-color: #0b0f19 !important;
            padding-top: 40px !important;
        }

        .markdown-section {
            max-width: 850px !important;
            color: #cbd5e1 !important;
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 1rem;
            padding: 2.5rem !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .markdown-section h1 {
            font-size: 1.8rem !important;
            color: #f8fafc !important;
            font-weight: 700;
            border-bottom: 1px solid #1e293b !important;
            padding-bottom: 0.75rem;
            margin-top: 0 !important;
        }

        .markdown-section h2, .markdown-section h3 {
            color: #f8fafc !important;
            font-weight: 600;
            border-bottom: none !important;
        }

        .markdown-section code {
            background-color: #1e293b !important;
            color: #38bdf8 !important;
            border-radius: 0.375rem;
            padding: 0.2rem 0.4rem;
        }

        .markdown-section pre {
            background-color: #0f172a !important;
            border: 1px solid #1e293b !important;
            border-radius: 0.75rem !important;
        }

        .markdown-section blockquote {
            border-left: 4px solid #38bdf8 !important;
            background-color: rgba(56, 189, 248, 0.05);
            color: #94a3b8 !important;
            border-radius: 0 0.5rem 0.5rem 0;
            margin: 1.5rem 0;
        }

        /* Mobile adjustments for hamburger toggle if needed on small screens */
        @media screen and (max-width: 768px) {
            .sidebar-toggle {
                display: block !important;
                background-color: rgba(17, 24, 39, 0.8) !important;
                top: 70px !important;
            }
        }
    </style>
</head>
<body>
    <!-- Top Forum Navigation Bar (Discourse / Roblox DevForum style) -->
    <header class="forum-top-nav">
        <a href="/blog/blog" class="forum-brand">
            <img src="/image/kwicon.svg" alt="KW Logo">
            <span>Karaoke Wonders Community</span>
        </a>
        <nav class="forum-nav-links">
            <a href="/main">Main Dashboard</a>
            <a href="/public/about">About</a>
            <a href="https://discord.gg/sXaRMKKDbe" target="_blank">Discord</a>
        </nav>
    </header>

    <!-- Docsify Mount Element -->
    <div id="app">Loading forum topics...</div>

    <!-- Docsify Configuration -->
    <script>
      window.$docsify = {
        name: 'Categories',
        loadSidebar: true,
        basePath: '/blog/',
        auto2top: true,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Search topics & guides...',
          noData: 'No discussions found',
          depth: 3
        }
      }
    </script>
    
    <!-- Docsify Core JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docsify/4.13.1/docsify.min.js"></script>

    <!-- Docsify Search Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docsify/4.13.1/plugins/search.min.js"></script>
    <script src="/js/warn.js"></script>
</body>
</html>
