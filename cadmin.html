<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Karaoke Wonders</title>
    
    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Styles & Icons -->
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/image/kw.png" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-['Inter',sans-serif] p-6 sm:p-12">

    <!-- Background Glow Effects -->
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <main class="max-w-7xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-white/10 pb-6">
            <div>
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Admin Portal</span>
                <h1 class="text-3xl font-extrabold text-white mt-1">Applications Dashboard</h1>
                <p class="text-xs text-slate-400 mt-1">Review and manage incoming submissions.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="loadApplications()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white/5 hover:bg-white/10 border border-white/10 text-slate-200 transition-all flex items-center gap-2 cursor-pointer">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Data
                </button>
                <a href="/careers" target="_blank" class="px-4 py-2 rounded-xl text-xs font-bold text-black bg-gradient-to-r from-green-400 to-emerald-400 hover:from-green-300 transition-all">
                    View Form Page
                </a>
            </div>
        </div>

        <!-- Table Container -->
        <div class="glass bg-slate-900/80 border border-white/10 rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-white/10 bg-white/5 text-xs uppercase tracking-wider text-slate-300 font-semibold">
                            <th class="p-4">Date</th>
                            <th class="p-4">Position</th>
                            <th class="p-4">Discord</th>
                            <th class="p-4">VRChat</th>
                            <th class="p-4">Why Apply</th>
                            <th class="p-4">Availability</th>
                            <th class="p-4">Portfolio</th>
                            <th class="p-4">Status / Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-white/5">
                        <!-- Loading placeholder row -->
                        <tr>
                            <td colspan="7" class="p-8 text-center text-sm text-slate-400">
                                Loading applications from Google Sheets...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Admin JavaScript -->
    <script src="cadmin.js"></script>
</body>
</html>
