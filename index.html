<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - Karaoke Wonders</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-6 relative flex items-center justify-center min-h-screen">
    <!-- Background Glow Orbs -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 translate-y-1/2 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Auth Card -->
    <div class="glass max-w-md w-full p-8 sm:p-10 rounded-3xl relative z-10 shadow-2xl">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-green-400/20 to-blue-500/20 mb-4 border border-white/10">
                <i data-lucide="mic" class="w-6 h-6 text-green-400"></i>
            </div>
            <h1 class="text-3xl font-extrabold gradient-text mb-2">KaraokeWonders</h1>
            <p id="auth-subtitle" class="text-slate-400 text-sm">Sign in to access your stage profile</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border flex items-center gap-3">
            <i id="alert-icon" class="w-4 h-4 shrink-0"></i>
            <span id="alert-text"></span>
        </div>

        <!-- Auth Form -->
        <form id="auth-form" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium mb-2 text-slate-300">Username</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input type="text" id="username" required autocomplete="username" class="input-field w-full rounded-xl pl-11 pr-4 py-3 text-sm" placeholder="tells fox">
                </div>
            </div>

            <!-- Dynamic Registration Extra Field -->
            <div id="extra-fields" class="hidden">
                <label for="password" class="block text-sm font-medium mb-2 text-slate-300">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input type="password" id="password" class="input-field w-full rounded-xl pl-11 pr-4 py-3 text-sm" placeholder="Password">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full btn-primary py-3.5 rounded-xl font-bold text-black text-sm flex items-center justify-center gap-2 mt-2">
                <span id="btn-text">Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Toggle Mode Link -->
        <div class="mt-8 pt-6 border-t border-white/10 text-center">
            <p class="text-xs text-slate-400">
                <span id="toggle-label">Don't have an account?</span> 
                <button type="button" id="toggle-mode-btn" onclick="toggleMode()" class="text-green-400 font-bold hover:underline ml-1">
                    Request Access
                </button>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
