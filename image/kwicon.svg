<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-cyan-square" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90ee90" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="#070a12" />
  <circle cx="256" cy="256" r="200" fill="url(#glow)" />
  
  <!-- Outer Border Frame -->
  <rect width="504" height="504" x="4" y="4" rx="106" stroke="url(#neon-cyan-square)" stroke-width="4" fill="none" opacity="0.25" />

  <!-- ISOMETRIC KW EMBLEM (Centered & Scaled) -->
  <g transform="translate(96, 96) scale(3.2)">
    <!-- Outer Octagon Shield -->
    <polygon points="50,6 92,23 92,77 50,94 8,77 8,23" fill="none" stroke="url(#neon-cyan-square)" stroke-width="3.5" opacity="0.5" />
    
    <!-- 'K' Geometric Ribbon -->
    <path d="M 27 26 L 27 74 M 27 50 L 47 28 M 27 50 L 49 74" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 'W' Geometric Ribbon -->
    <path d="M 51 35 L 59 71 L 68 47 L 77 71 L 85 35" stroke="url(#neon-cyan-square)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
