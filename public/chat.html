<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://karaokewonders.fetched.workers.dev https://cloudflareinsights.com https://www.google-analytics.com https://*.google-analytics.com; img-src 'self' data: https:; object-src 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Karaoke Wonders</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="/files/lucide.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="icon" type="image/png" href="/image/kwicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <meta property="og:title" content="Karaoke Wonders - Karaoke" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karaokewonders.com/main" />
    <meta property="og:description" content="A website to view and request songs for our VRChat world's karaoke system!" />
    <meta property="og:site_name" content="Karaoke Wonders" />
    <meta property="og:image" content="https://karaokewonders.com/image/kw.png" />
    <meta name="theme-color" content="#90ee90" />
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/js/schema.js" defer></script>
</head>
<body class="mobile-centered-page p-6 relative flex items-center justify-center min-h-screen bg-slate-950 text-slate-100">

    <div id="kw-chat-widget" class="kw-chat-container">
      <div class="kw-chat-header">
        <div class="kw-chat-title">
          <span class="kw-status-dot"></span>
          <span>Karaoke Wonders Assistant</span>
        </div>
        <button type="button" id="kw-chat-toggle" aria-label="Toggle chat">−</button>
      </div>
      
      <div id="kw-chat-messages" class="kw-chat-messages">
        <div class="kw-message kw-message-ai">
          Welcome to Karaoke Wonders! Ask me anything about our VRChat world, events, community roles, or song requests.
        </div>
      </div>

      <form id="kw-chat-form" class="kw-chat-input-area">
        <input 
          type="text" 
          id="kw-chat-input" 
          placeholder="Type a question..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="kw-chat-send">Send</button>
      </form>
    </div>

<script src="/js/chat.js"></script>
</body>
</html>
