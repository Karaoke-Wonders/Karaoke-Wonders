<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://karaokewonders.fetched.workers.dev https://cloudflareinsights.com https://www.google-analytics.com https://*.google-analytics.com; img-src 'self' data: https:; object-src 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Karaoke Wonders</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="files/lucide.min.js"></script>
    <link rel="stylesheet" href="/web/css/style.css">
    <link rel="icon" type="image/png" href="/image/kwicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <meta property="og:title" content="Karaoke Wonders - Karaoke" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karaokewonders.com/main" />
    <meta property="og:description" content="A website to view and request songs for our VRChat world's karaoke system!" />
    <meta property="og:site_name" content="Karaoke Wonders" />
    <meta property="og:image" content="https://karaokewonders.com/image/kw.png" />
    <meta name="theme-color" content="#90ee90" />
    <link rel="stylesheet" href="/web/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/web/js/schema.js" defer></script>

<style>
  :root {
    --kw-bg: #0f172a;
    --kw-panel: #1e293b;
    --kw-accent: #90ee90;
    --kw-accent-hover: #76d776;
    --kw-accent-text: #052e16;
    --kw-text: #f8fafc;
    --kw-text-muted: #94a3b8;
    --kw-border: #334155;
    --kw-user-msg: #1e1b4b;
    --kw-user-border: #312e81;
  }

  /* Fullscreen Chat Container */
  .kw-chat-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* Adapts properly on mobile browser viewports */
    background-color: var(--kw-panel);
    border: none;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    box-shadow: none;
    font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    z-index: 9999;
    overflow: hidden;
  }

  /* Header Bar */
  .kw-chat-header {
    background-color: var(--kw-bg);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--kw-border);
    user-select: none;
  }

  .kw-chat-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    color: var(--kw-text);
    font-size: 1.1rem;
  }

  .kw-status-dot {
    width: 10px;
    height: 10px;
    background-color: var(--kw-accent);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px var(--kw-accent);
  }

  #kw-chat-toggle {
    display: none; /* Hidden for full-screen layout */
  }

  /* Messages Area */
  .kw-chat-messages {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
    scroll-behavior: smooth;
  }

  /* Custom Dark Scrollbar for Messages Area */
  .kw-chat-messages::-webkit-scrollbar {
    width: 6px;
  }

  .kw-chat-messages::-webkit-scrollbar-track {
    background: transparent;
  }

  .kw-chat-messages::-webkit-scrollbar-thumb {
    background-color: var(--kw-border);
    border-radius: 3px;
  }

  /* Base Message Bubbles */
  .kw-message {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    line-height: 1.6;
    word-break: break-word;
  }

  .kw-message-user {
    background-color: var(--kw-user-msg);
    color: #ffffff;
    align-self: flex-end;
    border: 1px solid var(--kw-user-border);
    border-bottom-right-radius: 4px;
  }

  .kw-message-ai {
    background-color: var(--kw-bg);
    color: var(--kw-text);
    align-self: flex-start;
    border: 1px solid var(--kw-border);
    border-bottom-left-radius: 4px;
  }

  .kw-message-loading {
    opacity: 0.7;
    font-style: italic;
  }

  /* ==========================================================================
     MARKDOWN RENDERING STYLES (inside AI messages)
     ========================================================================== */

  .kw-message-ai p {
    margin: 0 0 12px 0;
  }

  .kw-message-ai p:last-child {
    margin-bottom: 0;
  }

  .kw-message-ai ul,
  .kw-message-ai ol {
    margin: 8px 0 12px 20px;
    padding: 0;
  }

  .kw-message-ai ul {
    list-style-type: disc;
  }

  .kw-message-ai ol {
    list-style-type: decimal;
  }

  .kw-message-ai li {
    margin-bottom: 6px;
  }

  .kw-message-ai li:last-child {
    margin-bottom: 0;
  }

  /* Clickable Links */
  .kw-message-ai a {
    color: var(--kw-accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-weight: 500;
    transition: color 0.2s;
  }

  .kw-message-ai a:hover {
    color: var(--kw-accent-hover);
  }

  /* Bold & Emphasis */
  .kw-message-ai strong {
    color: #ffffff;
    font-weight: 700;
  }

  .kw-message-ai em {
    color: var(--kw-text-muted);
  }

  /* Inline Code & Code Blocks */
  .kw-message-ai code {
    background-color: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.88em;
  }

  .kw-message-ai pre {
    background-color: #090d16;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid var(--kw-border);
    margin: 10px 0;
  }

  .kw-message-ai pre code {
    background-color: transparent;
    padding: 0;
  }

  /* Blockquotes */
  .kw-message-ai blockquote {
    border-left: 3px solid var(--kw-accent);
    margin: 10px 0;
    padding-left: 12px;
    color: var(--kw-text-muted);
  }

  /* ==========================================================================
     INPUT AREA (Full-width background with centered container)
     ========================================================================== */

  .kw-chat-footer {
    background-color: var(--kw-bg);
    border-top: 1px solid var(--kw-border);
    width: 100%;
  }

  .kw-chat-input-area {
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  #kw-chat-input {
    flex: 1;
    background-color: var(--kw-panel);
    border: 1px solid var(--kw-border);
    color: var(--kw-text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #kw-chat-input:focus {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 2px rgba(144, 238, 144, 0.15);
  }

  #kw-chat-input::placeholder {
    color: var(--kw-text-muted);
  }

  #kw-chat-send {
    background-color: var(--kw-accent);
    color: var(--kw-accent-text);
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background-color 0.2s, opacity 0.2s;
  }

  #kw-chat-send:hover:not(:disabled) {
    background-color: var(--kw-accent-hover);
  }

  #kw-chat-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* AI Thought Process Box */
  .kw-thought-container {
    margin-bottom: 12px;
    background-color: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--kw-border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 0.85rem;
  }

  .kw-thought-summary {
    padding: 8px 12px;
    font-weight: 600;
    color: var(--kw-text-muted);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s, color 0.2s;
  }

  .kw-thought-summary:hover {
    background-color: rgba(255, 255, 255, 0.05);
    color: var(--kw-accent);
  }

  /* Accent styling for the disclosure triangle */
  .kw-thought-summary::marker,
  .kw-thought-summary::-webkit-details-marker {
    color: var(--kw-accent);
  }

  .kw-thought-content {
    padding: 10px 12px;
    border-top: 1px solid var(--kw-border);
    color: #94a3b8;
    font-family: monospace;
    white-space: pre-wrap;
    font-size: 0.82rem;
    line-height: 1.5;
    background-color: #080d1a;
    max-height: 250px;
    overflow-y: auto;
  }
</style>
</head>
<body class="mobile-centered-page p-6 relative flex items-center justify-center min-h-screen bg-slate-950 text-slate-100">

    <div id="kw-chat-widget" class="kw-chat-container">
      <div class="kw-chat-header">
        <div class="kw-chat-title">
          <span class="kw-status-dot"></span>
          <span>Karaoke Wonders Assistant</span>
        </div>
        <button type="button" id="kw-chat-toggle" aria-label="Toggle chat">−</button>
      </div>
      
      <div id="kw-chat-messages" class="kw-chat-messages">
        <div class="kw-message kw-message-ai">
          Welcome to Karaoke Wonders! Ask me anything about our VRChat world, events, community roles, or song requests.
        </div>
      </div>

      <form id="kw-chat-form" class="kw-chat-input-area">
        <input 
          type="text" 
          id="kw-chat-input" 
          placeholder="Type a question..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="kw-chat-send">Send</button>
      </form>
    </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const chatContainer = document.getElementById('kw-chat-widget');
    const chatMessages = document.getElementById('kw-chat-messages');
    const chatForm = document.getElementById('kw-chat-form');
    const chatInput = document.getElementById('kw-chat-input');
    const chatSendBtn = document.getElementById('kw-chat-send');
    const chatToggleBtn = document.getElementById('kw-chat-toggle');

    if (chatToggleBtn) {
      chatToggleBtn.addEventListener('click', () => {
        chatContainer.classList.toggle('minimized');
        chatToggleBtn.textContent = chatContainer.classList.contains('minimized') ? '+' : '−';
      });
    }

    // Dynamic Topic Inspector: Detects context keywords from the reasoning stream
    function detectThoughtTopic(text) {
      const lower = text.toLowerCase();
      
      if (lower.includes('event') || lower.includes('schedule') || lower.includes('time') || lower.includes('date')) {
        return 'Thinking about events & schedule...';
      }
      if (lower.includes('song') || lower.includes('request') || lower.includes('queue') || lower.includes('music')) {
        return 'Thinking about song requests...';
      }
      if (lower.includes('vrchat') || lower.includes('world') || lower.includes('instance') || lower.includes('join')) {
        return 'Thinking about VRChat world details...';
      }
      if (lower.includes('role') || lower.includes('staff') || lower.includes('team') || lower.includes('host')) {
        return 'Thinking about community roles & team...';
      }
      if (lower.includes('context') || lower.includes('database') || lower.includes('search') || lower.includes('query')) {
        return 'Analyzing database context...';
      }

      return 'Thinking...';
    }

    // Handle Streaming Chat Submission
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = chatInput.value.trim();
      if (!prompt) return;

      // 1. Render User Message
      appendMessage(prompt, 'user');
      chatInput.value = '';
      chatInput.disabled = true;
      chatSendBtn.disabled = true;

      // 2. Create AI Message Bubble Container
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.classList.add('kw-message', 'kw-message-ai');

      // Collapsible Live-Thinking Container
      const detailsEl = document.createElement('details');
      detailsEl.className = 'kw-thought-container';

      const summaryEl = document.createElement('summary');
      summaryEl.className = 'kw-thought-summary';
      
      const headerTextSpan = document.createElement('span');
      headerTextSpan.textContent = '🧠 Thinking...';
      summaryEl.appendChild(headerTextSpan);

      const thoughtContentEl = document.createElement('div');
      thoughtContentEl.className = 'kw-thought-content';

      detailsEl.appendChild(summaryEl);
      detailsEl.appendChild(thoughtContentEl);
      aiMsgDiv.appendChild(detailsEl);

      // Main Response Text Container
      const answerContainer = document.createElement('div');
      aiMsgDiv.appendChild(answerContainer);

      chatMessages.appendChild(aiMsgDiv);
      scrollToBottom();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        if (!response.ok) {
          throw new Error('Server returned an error response');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let rawAnswerText = '';
        let reasoningText = '';
        let isInsideThinkTag = false;
        let hasThinkingStarted = false;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.replace('data: ', '').trim();
              if (dataStr === '[DONE]') break;

              try {
                const parsed = JSON.parse(dataStr);
                const token = parsed.response || parsed.choices?.[0]?.delta?.content || '';

                // Detect <think> or <thought> opening tag
                if (token.includes('<think>') || token.includes('<thought>')) {
                  isInsideThinkTag = true;
                  hasThinkingStarted = true;
                  continue;
                }

                // Detect closing tag
                if (token.includes('</think>') || token.includes('</thought>')) {
                  isInsideThinkTag = false;
                  headerTextSpan.textContent = '🧠 Thought Process';
                  continue;
                }

                if (isInsideThinkTag) {
                  hasThinkingStarted = true;
                  reasoningText += token;
                  
                  // Stream reasoning into the dropdown box
                  thoughtContentEl.textContent = reasoningText;

                  // Dynamically update the header subject line as text flows in
                  const dynamicTopic = detectThoughtTopic(reasoningText);
                  headerTextSpan.textContent = `🧠 ${dynamicTopic}`;
                } else {
                  rawAnswerText += token;
                  
                  // Render stream answer in real time
                  if (window.marked) {
                    answerContainer.innerHTML = marked.parse(rawAnswerText);
                  } else {
                    answerContainer.textContent = rawAnswerText;
                  }
                }

                scrollToBottom();

              } catch (err) {
                // Ignore parsing errors for partial chunk fragments
              }
            }
          }
        }

        // Finalize header title when stream completes
        if (hasThinkingStarted) {
          headerTextSpan.textContent = '🧠 Thought Process';
        } else {
          // Remove container if no thinking tags were generated
          detailsEl.remove();
        }

      } catch (error) {
        console.error('Chat API Error:', error);
        answerContainer.textContent = 'Sorry, something went wrong. Please try again.';
      } finally {
        chatInput.disabled = false;
        chatSendBtn.disabled = false;
        chatInput.focus();
        scrollToBottom();
      }
    });

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('kw-message', `kw-message-${sender}`);

      if (sender === 'user') {
        msgDiv.textContent = text;
      } else if (window.marked) {
        msgDiv.innerHTML = marked.parse(text);
      } else {
        msgDiv.textContent = text;
      }

      chatMessages.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  });
</script>
</body>
</html>
