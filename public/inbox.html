<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <script>
  (function() {
    // 1. Check if the request carries the 'skip_loader' bypass key
    const urlParams = new URLSearchParams(window.location.search);
    const hasSkipFlag = urlParams.get('skip_loader') === 'true';

    // 2. If skip_loader is NOT present, instantly bounce to loading.html
    if (!hasSkipFlag) {
      const currentPath = window.location.pathname + window.location.search;
      const targetUrl = '/loading.html?page=' + encodeURIComponent(currentPath);
      window.location.replace(targetUrl);
    } else {
      // 3. Clean up ?skip_loader=true from the address bar so the URL stays clean
      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('skip_loader');
      const cleanSearch = cleanUrl.search ? cleanUrl.search : '';
      window.history.replaceState({}, document.title, cleanUrl.pathname + cleanSearch + cleanUrl.hash);
    }
  })();
</script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://karaokewonders.fetched.workers.dev https://karaokewondersinbox.fetched.workers.dev https://unpkg.com https://www.google-analytics.com; img-src 'self' data: https:; object-src 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Karaoke Wonders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/files/lucide.min.js"></script>
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col font-sans antialiased">

    <!-- Header Navigation -->
    <header class="border-b border-white/10 glass sticky top-0 z-50">
        <div id="inbox-header-inner" class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/main.html" class="p-2 bg-white/5 hover:bg-white/10 rounded-xl transition border border-white/10 text-slate-300">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <h1 id="inbox-title" class="text-xl font-bold tracking-tight">Notification Inbox</h1>
            </div>

            <div id="inbox-header-actions" class="flex items-center gap-3">
                <span id="inbox-count-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20">
                    0 Unread
                </span>
                <button onclick="fetchInboxNotifications()" class="p-2 bg-white/5 hover:bg-white/10 rounded-xl transition border border-white/10 text-slate-300">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-6 py-8">
        
        <div id="inbox-alert" class="hidden mb-6 p-4 rounded-2xl border text-sm flex items-center justify-between">
            <span id="inbox-alert-text"></span>
        </div>

        <!-- Notification List Container -->
        <div id="inbox-container" class="space-y-4">
            <div class="text-center py-16 glass rounded-3xl border border-white/10">
                <i data-lucide="loader-2" class="w-8 h-8 mx-auto text-purple-400 animate-spin mb-3"></i>
                <p class="text-slate-400 text-sm">Loading notifications from GitHub...</p>
            </div>
        </div>
    </main>

<script src="/js/session-sync.js"></script>
<script src="/js/inbox.js"></script>
</body>
</html>
