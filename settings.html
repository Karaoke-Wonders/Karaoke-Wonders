<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://karaokewonders.fetched.workers.dev; img-src 'self' data: https:; object-src 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Karaoke Wonders</title>
    
    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest" defer></script>
    
    <!-- Absolute Paths -->
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/image/kwicon.svg" />
    <meta name="theme-color" content="#90ee90" />
</head>
<body class="min-h-screen relative flex items-center justify-center bg-slate-950 text-slate-100 overflow-x-hidden font-['Inter',sans-serif] py-12">

    <!-- Background Glow Effects -->
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-fuchsia-500/15 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <!-- Main Container -->
    <main class="w-full max-w-lg p-6">
        <div class="glass p-8 sm:p-10 rounded-3xl border border-white/10 shadow-2xl relative overflow-hidden bg-slate-900/90 text-left">
            
            <!-- Header -->
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10">
                <div>
                    <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">User Profile</span>
                    <h2 class="text-2xl font-extrabold text-white mt-1">Account Settings</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Manage your personal details and preferences.</p>
                </div>
                <div class="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-300">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </div>
            </div>

            <form id="settings-form" class="space-y-6">
                
                <!-- Profile Picture Section -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Profile Picture</label>
                    <div class="flex items-center gap-4 bg-black/40 border border-white/10 p-4 rounded-2xl">
                        <!-- Preview Image -->
                        <div class="relative shrink-0">
                            <img id="avatar-preview" src="/image/kwicon.svg" alt="Profile Preview" class="w-16 h-16 rounded-full object-cover border-2 border-emerald-400/50 shadow-md">
                        </div>
                        <div class="space-y-1.5 flex-1">
                            <input type="url" id="pfp-url" name="pfp-url" placeholder="https://example.com/avatar.png" class="w-full bg-black/40 border border-white/10 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                            <p class="text-[11px] text-slate-400">Enter a direct image URL for your profile avatar.</p>
                        </div>
                    </div>
                </div>

                <!-- Username Section (Disabled/Locked) -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Username</label>
                        <span class="text-[10px] text-amber-400 flex items-center gap-1 font-medium">
                            <i data-lucide="lock" class="w-3 h-3"></i> Locked
                        </span>
                    </div>
                    <input type="text" id="username" name="username" value="CurrentUsername" disabled class="w-full bg-black/20 border border-white/5 rounded-xl p-3 text-sm text-slate-400 cursor-not-allowed select-none">
                    <p class="text-[11px] text-slate-500 mt-1">Username is synchronized across the portal and Discord bot and cannot be changed.</p>
                </div>

<!-- Email Section -->
<div>
    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Email Address (Optional)</label>
    <div class="relative">
        <input type="email" id="email" name="email" placeholder="user@example.com" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 pl-10 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
        <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
    </div>
</div>

                <!-- Status/Feedback Message -->
                <div id="status-message" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-between pt-4 border-t border-white/10">
                    <a href="/main" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all inline-flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                        <span>Cancel</span>
                    </a>
                    <button type="submit" id="save-btn" class="px-6 py-2.5 rounded-xl text-xs font-bold text-black bg-gradient-to-r from-green-400 to-emerald-400 hover:from-green-300 hover:to-emerald-300 transition-all shadow-lg shadow-green-500/10 inline-flex items-center gap-2">
                        <i data-lucide="save" class="w-3.5 h-3.5"></i>
                        <span>Save Changes</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Client-Side Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

            const pfpInput = document.getElementById('pfp-url');
            const pfpPreview = document.getElementById('avatar-preview');
            const settingsForm = document.getElementById('settings-form');
            const statusMsg = document.getElementById('status-message');

            // Live image preview update
            pfpInput.addEventListener('input', (e) => {
                const url = e.target.value.trim();
                if (url) {
                    pfpPreview.src = url;
                }
            });

            // Fallback for broken image URLs
            pfpPreview.addEventListener('error', () => {
                pfpPreview.src = '/image/kwicon.svg';
            });

            // Form Submit Handler
            settingsForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const usernameVal = document.getElementById('username').value.trim();
    const pfpVal = pfpInput.value.trim();
    const emailVal = document.getElementById('email').value.trim();

    // Construct payload with username and only non-empty fields
    const updatedData = {
        username: usernameVal
    };

    if (pfpVal) updatedData.pfp = pfpVal;
    if (emailVal) updatedData.email = emailVal;

    try {
        const response = await fetch('https://karaokewonders.fetched.workers.dev/api/user/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        });

        if (response.ok) {
            showStatus('Settings updated successfully!', 'success');
        } else {
            const errData = await response.json();
            showStatus(errData.error || 'Failed to update settings. Please try again.', 'error');
        }
    } catch (err) {
        showStatus('Network error while saving settings.', 'error');
    }
});

            function showStatus(msg, type) {
                statusMsg.textContent = msg;
                statusMsg.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-red-500/10', 'border-red-500/30', 'text-red-400');

                if (type === 'success') {
                    statusMsg.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
                } else {
                    statusMsg.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
                }
            }
        });
    </script>
</body>
</html>
