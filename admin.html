<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Library - Karaoke Wonders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-6 sm:p-10 relative overflow-x-hidden">

    <!-- Background Glow Effects -->
    <div class="fixed top-1/4 left-10 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="fixed bottom-10 right-10 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <main class="max-w-7xl mx-auto space-y-8">
        <!-- Header & Action Row -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-3xl font-extrabold tracking-tight">Song Library</h2>
                <p class="text-slate-400 text-sm mt-1">Browse approved karaoke backing tracks ready for your performance.</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative w-full md:w-72">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input type="text" id="search-input" placeholder="Search title or artist..." class="input-field w-full rounded-xl pl-11 pr-4 py-2.5 text-xs bg-slate-900 border border-white/10 text-white focus:outline-none focus:border-green-500">
                </div>
                <!-- Button to open Submission Popup -->
                <button onclick="openSubmissionModal()" class="px-4 py-2.5 bg-green-500 hover:bg-green-400 text-black font-bold text-xs rounded-xl transition-all flex items-center gap-2 shrink-0">
                    <i data-lucide="plus" class="w-4 h-4"></i> Request Song
                </button>
            </div>
        </div>

        <!-- Main Songs Grid Container -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="song-list">
            <!-- Dynamic song cards will load here via JavaScript -->
        </div>
    </main>

    <!-- Submission Modal Popup (Hidden by default) -->
    <div id="submission-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="glass bg-slate-900/90 border border-white/10 max-w-md w-full p-6 sm:p-8 rounded-3xl relative shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white">Request a Song</h3>
                <button onclick="closeSubmissionModal()" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="modal-upload-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Track Title</label>
                    <input type="text" id="modal-track-title" required class="w-full rounded-xl px-4 py-2.5 text-sm bg-slate-950 border border-white/10 text-white focus:outline-none focus:border-green-500" placeholder="e.g. Stay With Me">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Original Artist</label>
                    <input type="text" id="modal-track-artist" required class="w-full rounded-xl px-4 py-2.5 text-sm bg-slate-950 border border-white/10 text-white focus:outline-none focus:border-green-500" placeholder="e.g. Miki Matsubara">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">YouTube URL</label>
                    <input type="url" id="modal-track-url" required class="w-full rounded-xl px-4 py-2.5 text-sm bg-slate-950 border border-white/10 text-white focus:outline-none focus:border-green-500" placeholder="https://www.youtube.com/watch?v=...">
                </div>
                <button type="submit" class="w-full py-3 bg-green-500 hover:bg-green-400 text-black font-bold text-sm rounded-xl transition-all mt-4">
                    Submit to Queue
                </button>
            </form>
        </div>
    </div>

    <!-- Script to handle modal behavior -->
    <script>
        function openSubmissionModal() {
            document.getElementById('submission-modal').classList.remove('hidden');
            document.getElementById('submission-modal').classList.add('flex');
        }

        function closeSubmissionModal() {
            document.getElementById('submission-modal').classList.remove('flex');
            document.getElementById('submission-modal').classList.add('hidden');
        }

        // Initialize Lucide icons on load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
    <script src="dashboard.js"></script>
    <script src="main.js"></script>
</body>
</html>
